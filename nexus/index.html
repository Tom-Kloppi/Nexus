<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NEXUS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="transitions.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="modal-shell t-modal-backdrop" id="setup-screen">
      <div class="modal-card t-modal piece setup-card" role="dialog" aria-modal="true">
        <p class="modal-kicker">NEXUS 2.1</p>
        <h2>Neue Partie</h2>
        <p>Hot-Seat-Mehrspieler: Spieler wechseln sich am selben Gerät ab.</p>

        <p class="setup-label">Spielerzahl</p>
        <div class="pick-row" id="setup-player-count">
          <button type="button" class="btn setup-choice" data-count="2">2 Spieler</button>
          <button type="button" class="btn setup-choice" data-count="3">3 Spieler</button>
        </div>

        <p class="setup-label">Spiellänge</p>
        <div class="pick-row" id="setup-length">
          <button type="button" class="btn setup-choice" data-length="short">Kurz · 15</button>
          <button type="button" class="btn setup-choice" data-length="standard">Standard · 20</button>
          <button type="button" class="btn setup-choice" data-length="long">Lang · 25</button>
        </div>

        <button type="button" class="btn primary setup-start" id="btn-start-game">Partie starten</button>
      </div>
    </div>

    <div class="stage" id="stage">
      <header class="hud">
        <div class="brand">
          <h1>NEXUS</h1>
          <p class="day-line">
            Runde <span id="stat-round" class="t-digit-group">1</span>
            <span class="day-max">/ 20</span>
          </p>
        </div>

        <div class="turn-row" id="turn-row" aria-label="Spielerreihenfolge"></div>

        <ul class="wallet" aria-label="Ressourcen">
          <li class="wallet-item chip-energy" data-res="energy" title="Energie">
            <span class="token-icon" data-res="energy"></span>
            <strong id="res-energy" class="t-digit-group">3</strong>
            <span class="expect" id="expect-energy">~0</span>
          </li>
          <li class="wallet-item chip-data" data-res="data" title="Daten">
            <span class="token-icon" data-res="data"></span>
            <strong id="res-data" class="t-digit-group">3</strong>
            <span class="expect" id="expect-data">~0</span>
          </li>
          <li class="wallet-item chip-compute" data-res="compute" title="Rechenleistung">
            <span class="token-icon" data-res="compute"></span>
            <strong id="res-compute" class="t-digit-group">3</strong>
            <span class="expect" id="expect-compute">~0</span>
          </li>
          <li class="wallet-item chip-hardware" data-res="hardware" title="Bauteile">
            <span class="token-icon" data-res="hardware"></span>
            <strong id="res-hardware" class="t-digit-group">3</strong>
            <span class="expect" id="expect-hardware">~0</span>
          </li>
          <li class="wallet-item chip-connectivity" data-res="connectivity" title="Konnektivität">
            <span class="token-icon" data-res="connectivity"></span>
            <strong id="res-connectivity" class="t-digit-group">3</strong>
            <span class="expect" id="expect-connectivity">~0</span>
          </li>
        </ul>

        <div class="risk-pill" title="Risiko">
          <span class="risk-label">Risiko</span>
          <div id="risk-meter" class="risk-meter" style="--risk: 0"></div>
          <strong id="stat-risk" class="t-digit-group">0</strong>
        </div>
      </header>

      <main class="playfield">
        <section class="city-plane" aria-label="Distrikt">
          <div class="map-glow"></div>
          <svg id="district-svg" role="img" aria-label="Hex-Distrikt"></svg>
          <div id="float-layer" class="float-layer" aria-hidden="true"></div>
        </section>

        <aside class="dock" aria-label="Smart Home">
          <div class="dock-head">
            <h2>Home</h2>
            <p id="build-flags" class="build-flags"></p>
          </div>
          <div id="device-list" class="hotbar"></div>
          <div id="inspect-card" class="inspect sheet" hidden>
            <div class="inspect-top">
              <span id="inspect-icon" class="inspect-icon"></span>
              <div>
                <h3 id="inspect-title"></h3>
                <p id="inspect-effect" class="inspect-effect"></p>
              </div>
            </div>
            <div class="inspect-modes">
              <button type="button" class="mode-hit" id="mode-cloud" data-mode="cloud">
                <span class="mode-icon" data-mode="cloud"></span>
                <span class="mode-cost" id="inspect-cloud-cost"></span>
                <span class="mode-risk risk-row" id="inspect-cloud-risk"></span>
              </button>
              <button type="button" class="mode-hit" id="mode-local" data-mode="local">
                <span class="mode-icon" data-mode="local"></span>
                <span class="mode-cost" id="inspect-local-cost"></span>
              </button>
            </div>
          </div>
        </aside>
      </main>

      <footer class="action-bar">
        <p id="table-hint" class="hint">Tippe ein leuchtendes Feld an</p>
        <div class="action-buttons">
          <button type="button" class="btn ghost" id="btn-harvest-all">Alles ernten</button>
          <button type="button" class="btn primary" id="btn-end-round" disabled>Zug beenden</button>
        </div>
        <ol id="log-list" class="tape" aria-label="Verlauf"></ol>
      </footer>
    </div>

    <div id="toast-stack" class="toast-stack" aria-live="polite"></div>

    <div id="expand-modal" class="modal-shell t-modal-backdrop" hidden>
      <div class="modal-card t-modal piece" role="dialog" aria-modal="true">
        <p class="modal-kicker">Neues Feld</p>
        <div id="expand-cost" class="cost-line"></div>
        <div id="expand-choices" class="pick-row"></div>
        <button type="button" class="btn ghost" id="btn-expand-cancel">Zurück</button>
      </div>
    </div>

    <div id="event-modal" class="modal-shell t-modal-backdrop" hidden>
      <div class="modal-card t-modal piece" role="dialog" aria-modal="true">
        <h3 id="event-title">Ereignis</h3>
        <p id="event-text"></p>
        <div id="event-choices" class="choice-stack"></div>
        <div id="event-resource-pick" class="pick-row" hidden></div>
      </div>
    </div>

    <div id="end-screen" class="modal-shell t-modal-backdrop" hidden>
      <div class="modal-card t-modal piece end-card" role="dialog" aria-modal="true">
        <h2>Spiel beendet</h2>
        <div id="score-players" class="score-players"></div>
        <button type="button" class="btn primary" id="btn-restart">Neue Partie</button>
      </div>
    </div>

    <script src="js/data/constants.js"></script>
    <script src="js/data/tiles.js"></script>
    <script src="js/data/devices.js"></script>
    <script src="js/data/events.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/state.js"></script>
    <script src="js/render.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
